<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator web page</title>
   <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        font-family: Arial, sans-serif;
      }

      .calculator {
        background: #fff;
        padding: 25px;
        border-radius: 12px;
        width: 320px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .calculator h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      .input-group {
        margin-bottom: 15px;
      }

      .input-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
      }

      .input-group input {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 15px;
      }

      .buttons button {
        padding: 12px;
        font-size: 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #667eea;
        color: white;
        transition: background 0.2s;
      }

      .buttons button:hover {
        background: #5a67d8;
      }

      .result {
        margin-top: 20px;
        padding: 12px;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        background: #f3f4f6;
        border-radius: 6px;
        color: #333;
      }
    </style>
  </head>

  <body>
    <div class="calculator">
      <h2>Calculator</h2>

      <div class="input-group">
        <label for="num1">Number 1</label>
        <input type="number" id="num1" />
      </div>

      <div class="input-group">
        <label for="num2">Number 2</label>
        <input type="number" id="num2" />
      </div>

      <div class="buttons">
        <button onclick="calculate('add')">+</button>
        <button onclick="calculate('subtract')">−</button>
        <button onclick="calculate('multiply')">×</button>
        <button onclick="calculate('divide')">÷</button>
      </div>

      <div class="result">
        Result: <span id="result">—</span>
      </div>
    </div>
  <script>
    function calculate(operation) {
      let num1 = Number(document.getElementById("num1").value);
      let num2 = Number(document.getElementById("num2").value);


      // added this to prevent the fetch from even being called with invalid data, and shows a friendly message instead of sending NaN to the backend.
if (isNaN(num1) || isNaN(num2)) {
    document.getElementById("result").innerText = "Enter both numbers";
    return;
  }

      // EXERCISE3 -- connect front end to the backend service
      // made sure to add the CORS package to the backend to avoid CORS issues
      fetch(
        `http://localhost:3000/calculator/${operation}?num1=${num1}&num2=${num2}`
      )
        .then((response) => response.json())
        .then((json) => (document.getElementById("result").innerText = json.result)
        ) // this is coming from the calculatorRoutes.js file

        // to catch errors such as division by zero
        .catch(err => {
      document.getElementById("result").innerText = "Could not calculate";
      console.error(err);
  });
    }
  </script>
</html>
