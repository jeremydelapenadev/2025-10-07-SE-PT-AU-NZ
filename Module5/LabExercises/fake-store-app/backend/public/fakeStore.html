<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fake E Commerce Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <script
    src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"
  ></script>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">E-Commerce</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <select id="category-filter" class="form-select mb-3">
              <option value="all">All Categories</option>
              <option value="electronics">Electronics</option>
              <option value="jewelery">Jewelery</option>
              <option value="men's clothing">Men's Clothing</option>
              <option value="women's clothing">Women's Clothing</option>
            </select>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Cards -->

    <div class="container mt-4">
      <div class="row" id="card-list"></div>
    </div>

    <!-- Responsive design applied to all cards above. -->
    <template id="card-template">
      <div class="col-lg-3 col-md-4 col-sm-12 mb-3">
        <div class="card">
          <img
            src="https://source.widen.net/content/7yk7jmsaxj/webp/WRG-2241030_3-ft-Nordic-Frost-Decorated-Tree-Kit_SSC.webp"
            class="card-img-top"
            alt="..."
          />
          <div class="card-body">
            <h5 class="card-title"></h5>
            <p class="card-text"></p>
            <a href="#" class="btn btn-primary">Click here</a>
          </div>
        </div>
      </div>
    </template>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const cardList = document.getElementById("card-list");
        const cardTemplate = document.getElementById("card-template");
        const filter = document.getElementById("category-filter");

        let productsData = [];

        fetch("http://localhost:3000/api/products")
          .then((res) => res.json())
          .then((products) => {
            productsData = products;
            renderCards(productsData);
          })
          .catch((err) => console.error(err));

        function renderCards(productsArray) {
          cardList.innerHTML = "";

          productsArray.forEach((product) => {
            const card = cardTemplate.content.cloneNode(true);
            card.querySelector(".card-img-top").src = product.image;
            card.querySelector(".card-title").innerText = product.title;
            card.querySelector(".card-text").innerText = product.description;
            card.querySelector(".btn").innerText = `$${product.price}`;
            cardList.appendChild(card);
          });
        }

        filter.addEventListener("change", () => {
          const selected = filter.value;

          const filteredProducts =
            selected === "all"
              ? productsData
              : productsData.filter((p) => p.category === selected);

          renderCards(filteredProducts);
        });
      });
    </script>
  </body>
</html>
