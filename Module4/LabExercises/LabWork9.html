<!-- Adapt the code on the right to make a chart that shows how
many items are listed under each category on the Fake Store
API.

Get data from the FakeStore API (Fetch or Axios the data)
Have an eChart bar for each category
Show how many items are listed under each category. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fake Store eCharts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- eCharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.1/dist/echarts.min.js"></script>

</head>
<body>
<!-- Prepare a DOM with a defined width and height for ECharts -->
  <div id="main" style="width: 900px;height:600px;"></div>

  <script>
    // Initialize the echarts instance based on the prepared div
    const chartDom = document.getElementById("main");
    const myChart = echarts.init(chartDom);

    // 2️⃣ Base options
    const options = {
      title: { text: "Fake Store Products by Category" },
      tooltip: {}, // shows extra information when you hover over a bar on each category
      xAxis: { type: "category", data: [] }, // getting the categories from FakeStoreAPI
      yAxis: { type: "value" }, series: [ // display the data of the number of products from each category
        {
          name: "Number of Products",
          type: "bar",
          data: []
        }
      ]
    };

    // fetch and process data
    fetch("https://fakestoreapi.com/products")
      .then(res => res.json())
      .then(products => {
        const categoryCount = {};

        products.forEach(p => { // counts how many products belong to each category so you can display those totals in the chart, starting from 0
          categoryCount[p.category] =
            (categoryCount[p.category] || 0) + 1;
        });

        // Convert to arrays
        options.xAxis.data = Object.keys(categoryCount);
        options.series[0].data = Object.values(categoryCount);

        // render chart
        myChart.setOption(options);
      })
      .catch(err => console.error(err));
  </script>

</body>
</html>
