<!-- Create a web page that will read the posts from JSON Placeholder using
fetch.
Using techniques from the previous templating labs, use bootstrap cards
and grids to layout the returned post data from JSON Placeholder on the
page.

Make use of the fetch API to retrieve data online and display it. Set
the limit default to 10. When the page loads up, it will use the
default value. -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 4 - Lab Work</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="card">
  <div class="card-header"> Bootstrap Cards</div>

    <div class="container mt-4">
      <div class="row" id="postContainer"></div>
    </div>
  </body>

  <script>
    fetch("https://jsonplaceholder.typicode.com/posts?_limit=10")
      .then((response) => response.json())
      .then((posts) => {
        const container = document.getElementById("postContainer");

        container.innerHTML = ""; // clear container initially

        posts.forEach((post) => {
          const col = document.createElement("div");
          col.className = "col-md-3 mb-4";

          col.innerHTML = `<div class="card h-100"> <div class="card-body"> <h5 class="card-title">${post.title}</h5> <p class="card-text">${post.body}</p></div></div>`;

          container.appendChild(col);
        });
      })
      .catch((error) => console.error("Error fetching posts:", error));
  </script>
</html>
