<!DOCTYPE html>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">E-Commerce</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <select id="category-filter" class="form-select mb-3">
              <option value="all">All Categories</option>
              <option value="electronics">Electronics</option>
              <option value="jewelery">Jewelery</option>
              <option value="men's clothing">Men's Clothing</option>
              <option value="women's clothing">Women's Clothing</option>
            </select>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Cards -->

    <div class="container mt-4">
      <div class="row" id="card-list"></div>
    </div>

    <!-- Responsive design applied to all cards above. -->
    <template id="card-template">
      <div class="col-lg-3 col-md-4 col-sm-12 mb-3">
        <div class="card">
          <img
            src="https://source.widen.net/content/7yk7jmsaxj/webp/WRG-2241030_3-ft-Nordic-Frost-Decorated-Tree-Kit_SSC.webp"
            class="card-img-top"
            alt="..."
          />
          <div class="card-body">
            <h5 class="card-title"></h5>
            <p class="card-text"></p>
            <a href="#" class="btn btn-primary">Click here</a>
          </div>
        </div>
      </div>
    </template>

    <script>

      const cardTemplate = document.getElementById("card-template");

      const cardList = document.getElementById("card-list");
      const cardTemplate = document.getElementById("card-template");
      const filter = document.getElementById("category-filter");

      let productsData = []; // store all products globally

      // Fetch all products from Fake Store API
      fetch("https://fakestoreapi.com/products")
        .then((res) => res.json())
        .then((products) => {
          productsData = products; // save globally
          renderCards(productsData); // show all products initially
        })
        .catch((err) => console.error(err));

      // Function to render cards from any array of products
      function renderCards(productsArray) {
        cardList.innerHTML = ""; // clear existing cards
        productsArray.forEach((product) => {
          const card = cardTemplate.content.cloneNode(true);
          card.querySelector(".card-img-top").src = product.image;
          card.querySelector(".card-title").innerText = product.title;
          card.querySelector(".card-text").innerText = product.description;
          card.querySelector(".btn").innerText = `$${product.price}`;
          cardList.appendChild(card);
        });
      }

      // Filter products whenever dropdown changes
      filter.addEventListener("change", () => {
        const selected = filter.value;

        if (selected === "all") {
          renderCards(productsData); // show all products
        } else {
          const filtered = productsData.filter((p) => p.category === selected);
          renderCards(filtered); // show only selected category
        }
      });

      // fetches the products from FakeStoreAPI
      fetch("https://fakestoreapi.com/products")
        .then((res) => res.json())
        .then((products) => {
          products.forEach((product) => {
            // clone template
            const card = cardTemplate.content.cloneNode(true);

            // populate content with product data (image, title, description, price)
            card.querySelector(".card-img-top").src = product.image;
            card.querySelector(".card-title").innerText = product.title;
            card.querySelector(".card-text").innerText = product.description;
            card.querySelector(".btn").innerText = `$${product.price}`;

            // append to container
            cardList.appendChild(card);
          });
        })
        .catch((err) => console.error(err));
    </script>
  </body>
