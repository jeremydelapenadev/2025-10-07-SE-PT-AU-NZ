<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Templates</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #e3f2fd;
      }
      .card {
        padding: 10px;
      }
      .card-title {
        font-weight: 600;
        font-size: 3em;
        padding: 0 0 10px 0;
      }
      .card-description {
        font-weight: 400;
        font-size: 2em;
      }
    </style>
  </head>
  <body>
    <template id="card-template">
      <div class="card">
        <div class="card-body">
          <div class="card-title"></div>
          <div class="card-description"></div>
        </div>
      </div>
    </template>
    <div id="card-list"></div>
  </body>

  <script>
    // Exercise 1 - Added cardTitle and cardDescription to pass content for the card dynamically
    function addCard(cardTitle, cardDescription) {
      // clone the template
      const template = document
        .getElementById("card-template")
        .content.cloneNode(true);
      // populate the template
      template.querySelector(".card-title").innerText = cardTitle;
      template.querySelector(".card-description").innerText = cardDescription;
      // include the populated template into the page
      document.querySelector("#card-list").appendChild(template);
    }

    // Exercise 2
    const data = [
      { name: "bob", age: 23 },
      { name: "alice", age: 39 },
    ];

    data.map((data) => addCard(data.name, data.age));

    /*
    // alternatively, this can be used with the same output

    data.forEach((data) => {
      addCard(data.name, data.age);
    });

    */

    // Exercise3
    function addArtistCard(cardTitle, cardDescription, cardURL) {
      // clone the template
      const template = document
        .getElementById("card-template")
        .content.cloneNode(true);
      // populate the template
      template.querySelector(".card-title").innerText = `${cardDescription} by ${cardTitle}`;
      
      //create a clickable link
      const link = document.createElement("a");
      link.href = cardURL; // ses where the link points to
      link.target = "_blank"; // opens in a new tab
      link.innerText = "View Artwork";
      template.querySelector(".card-description").appendChild(link);
      // include the populated template into the page
      document.querySelector("#card-list").appendChild(template);
    };

    const artist = [
      {
        name: "Vincent Van Gogh",
        portfolio: [
          {
            title: "portrait",
            url: "https://collectionapi.metmuseum.org/api/collection/v1/iiif/436532/1671316/main-image",
          },
          {
            title: "sky",
            url: "https://mymodernmet.com/wp/wp-content/uploads/2020/11/White-house-night-van-goh-worldwide-2.jpg",
          },
        ],
      },
      {
        name: "Leonardo Da Vinci",
        portfolio: [
          {
            title: "Mona Lisa",
            url: "https://cdn.britannica.com/24/189624-050-F3C5BAA9/Mona-Lisa-oil-wood-panel-Leonardo-da.jpg",
          },
          {
            title: "Last Supper",
            url: "https://cdn.britannica.com/04/95904-050-7EB39FC8/Last-Supper-wall-painting-restoration-Leonardo-da-1999.jpg",
          },
        ],
      },
      {
        name: "Michaelangelo",
        portfolio: [
          {
            title: "The Creation of Adam",
            url: "https://uploads4.wikiart.org/00255/images/michelangelo/michelangelo-creation-of-adam-cropped.jpg!Large.jpg",
          },
          {
            title: "David",
            url: "https://uploads3.wikiart.org/images/michelangelo/david-1504.jpg!Large.jpg",
          },
        ],
      },
    ];

    artist.forEach(artist => {
      artist.portfolio.forEach(item => {
        addArtistCard(artist.name, item.title, item.url);
      });
    });
  </script>
</html>
