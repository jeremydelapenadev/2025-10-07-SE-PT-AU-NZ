<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards Template</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&family=Bitcount+Prop+Double+Ink:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <style>
    body {
      /*font-family: Arial, Helvetica, sans-serif; */
      font-family: "Bitcount Grid Single", system-ui;
      background-color: #e3f2fd;
    }
    .card {
      padding: 10px;
    }
    .card-title {
      font-weight: 600;
      font-size: 3em;
      padding: 0 0 10px 0;
      font-family: ;
    }
    .card-description {
      font-weight: 400;
      font-size: 2em;
      
    }
  </style>

<script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js">
</script>

  <body>
    <template id="card-template">
      <div class="card">
        <div class="card-body">
          <iconify-icon icon="jam:baidu" width="180" height="180"  style="color: #cc7b22"></iconify-icon>
          <div class="card-title"></div>
          <div class="card-description"></div>
        </div>
      </div>
    </template>
    <div id="card-list"></div>
    
    <iconify-icon icon="material-symbols:accessible-forward-rounded" width="180" height="180"  style="color: #4a5dca"></iconify-icon>
  </body>

  <script>
    function addCard(cardTitle, cardDescription) {
      const template = document
        .getElementById("card-template")
        .content.cloneNode(true);
      template.querySelector(".card-title").innerText = cardTitle;
      template.querySelector(".card-description").innerText = cardDescription;

      document.querySelector("#card-list").appendChild(template);
    }
    addCard("Card1", "Description1");
    addCard("Happy Birthday", "This is For You!");
  </script>
</html>
