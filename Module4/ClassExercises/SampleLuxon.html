<body>
    <div id="showDate"></div>
    Current New York time: <div id="nytime"></div>
</body>
<script>
    const DateTime = luxon.DateTime;
    let nowLuxon = DateTime.now();
    document.getElementById("showDate").innerText = nowLuxon.toFormat("MMMM dd, yyyy"); 

let newYork = nowLuxon.setZone("America/New_York").toLocaleString(DateTime.DATETIME_FULL);
let londonTime = nowLuxon.setZone("America/New_York").toLocaleString(DateTime.DATETIME_FULL);

let end = DateTime.fromISO("2018-03-13");
let start = DateTime.fromISO("2011-02-11");
document.getElementById("nytime").innerText = (end.diff(start, ['years', 'months', 'days']).toObject()).days

// document.getElementById("nytime").innerText = newYork;
</script>
